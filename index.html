<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LinkUp - Verify</title>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto; }
  body { background: #0b141a; color: #e9edef; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
  .box { background: #202c33; padding: 40px 25px; border-radius: 15px; width: 100%; max-width: 400px; text-align: center; }
  .logo { font-size: 50px; margin-bottom: 10px; }
  h2 { font-size: 22px; font-weight: 600; margin-bottom: 8px; }
  p { font-size: 14px; color: #aebac1; margin-bottom: 25px; line-height: 1.5; }
  p b { color: #8B5CF6; }
  input[type="email"] { width: 100%; padding: 14px; margin: 10px 0 20px; border-radius: 8px; border: 1px solid #2a3942; background: #2a3942; color: white; font-size: 15px; }
  input:focus { outline: 2px solid #8B5CF6; }
  
  /* WHATSAPP OTP BOXES */
  .otp-container { display: flex; justify-content: space-between; gap: 8px; margin: 20px 0; }
  .otp-input { width: 45px; height: 50px; text-align: center; font-size: 24px; font-weight: bold; border: 2px solid #2a3942; border-radius: 8px; background: #2a3942; color: white; }
  .otp-input:focus { border-color: #8B5CF6; outline: none; }
  
  button { width: 100%; padding: 14px; background: #8B5CF6; color: white; border: none; border-radius: 25px; font-weight: 600; font-size: 16px; cursor: pointer; margin-top: 15px; }
  button:disabled { background: #555; }
  .hidden { display: none; }
  #message { text-align: center; margin-top: 15px; font-weight: bold; }
  .resend { color: #8B5CF6; text-align: center; margin-top: 10px; font-size: 14px; cursor: pointer; font-weight: 600; }
  .resend.disabled { color: #54656f; cursor: not-allowed; }
  .timer { color: #aebac1; font-size: 13px; text-align: center; margin-top: 5px; }
</style>
</head>
<body>

<div class="box">
  <div class="logo">🔮</div>
  <h2>Verify your email</h2>
  
  <div id="step1">
    <p>LinkUp will send you a 6-digit code to verify your email</p>
    <input type="email" id="email" placeholder="Enter your email" required>
    <button onclick="sendOTP()">Send Code</button>
  </div>

  <div id="step2" class="hidden">
    <p>We sent a 6-digit code to <br><b id="showEmail"></b></p>
    
    <div class="otp-container">
      <input type="text" class="otp-input" maxlength="1" onkeyup="moveNext(this, 0)">
      <input type="text" class="otp-input" maxlength="1" onkeyup="moveNext(this, 1)">
      <input type="text" class="otp-input" maxlength="1" onkeyup="moveNext(this, 2)">
      <input type="text" class="otp-input" maxlength="1" onkeyup="moveNext(this, 3)">
      <input type="text" class="otp-input" maxlength="1" onkeyup="moveNext(this, 4)">
      <input type="text" class="otp-input" maxlength="1" onkeyup="moveNext(this, 5)">
    </div>
    
    <button onclick="verifyOTP()">Verify</button>
    
    <p id="timer" class="timer">Resend code in 60s</p>
    <p id="resendBtn" class="resend disabled">Resend Code</p>
    <p id="message"></p>
  </div>
</div>

<script>
(function(){ emailjs.init("KjEOuOylcmZSiRElm"); })();
const SERVICE_ID = "service_uc66is9";
const TEMPLATE_ID = "template_7itzm37";

let generatedOTP = "";
let userEmail = "";
let countdown = 60;
let timerInterval;

function moveNext(input, index) {
  if(input.value.length === 1) {
    const next = input.nextElementSibling;
    if(next) next.focus();
  }
  if(input.value.length === 0 && index > 0) {
    input.previousElementSibling.focus();
  }
}

function getOTP() {
  let otp = "";
  document.querySelectorAll(".otp-input").forEach(i => otp += i.value);
  return otp;
}

function generateOTP() {
  return Math.floor(100000 + Math.random() * 900000).toString();
}

function startTimer() {
  countdown = 60;
  document.getElementById("resendBtn").classList.add("disabled");
  document.getElementById("resendBtn").onclick = null;
  
  timerInterval = setInterval(() => {
    countdown--;
    document.getElementById("timer").innerText = `Resend code in ${countdown}s`;
    if(countdown <= 0) {
      clearInterval(timerInterval);
      document.getElementById("timer").innerText = "";
      document.getElementById("resendBtn").classList.remove("disabled");
      document.getElementById("resendBtn").onclick = resendOTP;
    }
  }, 1000);
}

function sendOTP() {
  const email = document.getElementById("email").value;
  if(!email) return alert("Please enter your email");
  userEmail = email;
  generatedOTP = generateOTP();
  
  const templateParams = { to_email: email, code: generatedOTP };
  document.querySelector("#step1 button").disabled = true;

  emailjs.send(SERVICE_ID, TEMPLATE_ID, templateParams)
    .then(() => {
      document.getElementById("step1").classList.add("hidden");
      document.getElementById("step2").classList.remove("hidden");
      document.getElementById("showEmail").innerText = email;
      startTimer();
      document.querySelector(".otp-input").focus();
    })
    .catch((err) => alert("Error: " + JSON.stringify(err)));
}

function resendOTP() {
  document.getElementById("message").innerText = "Sending new code...";
  document.getElementById("message").style.color = "#8B5CF6";
  sendOTP();
}

function verifyOTP() {
  const userOTP = getOTP();
  const msg = document.getElementById("message");
  
  if(userOTP === generatedOTP) {
    clearInterval(timerInterval);
    msg.style.color = "#25D366";
    msg.innerText = "✅ Verified! Welcome to LinkUp";
    // window.location.href = "dashboard.html";
  } else {
    msg.style.color = "#f15c6d";
    msg.innerText = "❌ Wrong code. Try again";
  }
}
</script>

</body>
</html>
