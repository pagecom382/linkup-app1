<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LinkUp - Email Verification</title>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', Arial; background: #0a0a0a; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
  .box { background: #1a1a1a; padding: 35px 25px; border-radius: 20px; width: 100%; max-width: 420px; box-shadow: 0 0 20px rgba(139, 92, 246, 0.3); }
  h2 { text-align: center; margin-bottom: 10px; color: #8B5CF6; }
  p { text-align: center; font-size: 14px; color: #aaa; margin-bottom: 20px; }
  input { width: 100%; padding: 14px; margin: 10px 0; border-radius: 10px; border: 1px solid #333; background: #222; color: white; font-size: 15px; }
  input:focus { outline: 2px solid #8B5CF6; }
  button { width: 100%; padding: 14px; background: #8B5CF6; color: white; border: none; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
  button:disabled { background: #555; cursor: not-allowed; }
  .hidden { display: none; }
  #message { text-align: center; margin-top: 15px; font-weight: bold; }
  .resend { color: #8B5CF6; text-align: center; margin-top: 10px; font-size: 14px; cursor: pointer; }
  .resend.disabled { color: #555; cursor: not-allowed; }
  .timer { color: #aaa; font-size: 13px; text-align: center; margin-top: 5px; }
</style>
</head>
<body>

<div class="box">
  <h2>LinkUp 🔮</h2>
  <p>Connect with destiny</p>
  
  <div id="step1">
    <input type="email" id="email" placeholder="Enter your email" required>
    <button onclick="sendOTP()">Send Verification Code</button>
  </div>

  <div id="step2" class="hidden">
    <p>We sent 6-digit code to <b id="showEmail" style="color:#8B5CF6"></b></p>
    <input type="text" id="otp" placeholder="Enter 6 digit code" maxlength="6">
    <button onclick="verifyOTP()">Verify & Continue</button>
    
    <div id="resendSection">
      <p id="timer" class="timer">Resend code in 60s</p>
      <p id="resendBtn" class="resend disabled" onclick="resendOTP()">Resend Code</p>
    </div>
    
    <p id="message"></p>
  </div>
</div>

<script>
// YOUR EMAILJS KEYS
(function(){ emailjs.init("KjEOuOylcmZSiRElm"); })();

const SERVICE_ID = "service_uc66is9";
const TEMPLATE_ID = "template_7itzm37";

let generatedOTP = "";
let userEmail = "";
let countdown = 60;
let timerInterval;

function generateOTP() {
  return Math.floor(100000 + Math.random() * 900000).toString();
}

function startTimer() {
  countdown = 60;
  document.getElementById("resendBtn").classList.add("disabled");
  document.getElementById("resendBtn").onclick = null;
  
  timerInterval = setInterval(() => {
    countdown--;
    document.getElementById("timer").innerText = `Resend code in ${countdown}s`;
    
    if(countdown <= 0) {
      clearInterval(timerInterval);
      document.getElementById("timer").innerText = "";
      document.getElementById("resendBtn").classList.remove("disabled");
      document.getElementById("resendBtn").onclick = resendOTP;
      document.getElementById("resendBtn").innerText = "Didn't get code? Resend";
    }
  }, 1000);
}

function sendOTP() {
  const email = document.getElementById("email").value;
  if(!email) return alert("Please enter your email");
  
  userEmail = email;
  generatedOTP = generateOTP();
  
  const templateParams = {
    to_email: email,
    code: generatedOTP
  };

  document.querySelector("#step1 button").disabled = true;
  document.querySelector("#step1 button").innerText = "Sending...";

  emailjs.send(SERVICE_ID, TEMPLATE_ID, templateParams)
    .then(() => {
      document.getElementById("step1").classList.add("hidden");
      document.getElementById("step2").classList.remove("hidden");
      document.getElementById("showEmail").innerText = email;
      startTimer(); // START 60s COUNTDOWN
    })
    .catch((err) => {
      alert("Error: " + JSON.stringify(err));
      document.querySelector("#step1 button").disabled = false;
      document.querySelector("#step1 button").innerText = "Send Verification Code";
    });
}

function resendOTP() {
  document.getElementById("message").innerText = "Sending new code...";
  document.getElementById("message").style.color = "#8B5CF6";
  sendOTP(); // SEND NEW OTP
}

function verifyOTP() {
  const userOTP = document.getElementById("otp").value;
  const msg = document.getElementById("message");
  
  if(userOTP === generatedOTP) {
    clearInterval(timerInterval);
    msg.style.color = "#4ade80";
    msg.innerText = "✅ Verified! Welcome to LinkUp";
    // REDIRECT HERE: window.location.href = "dashboard.html";
  } else {
    msg.style.color = "#ef4444";
    msg.innerText = "❌ Wrong code. Please try again";
  }
}
</script>

</body>
</html>
