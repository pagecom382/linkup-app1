<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LINKup</title>
  <meta name="theme-color" content="#128C7E">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0b141a; color:#e9edef; height:100vh; overflow:hidden; }
    
   .screen { display: none; height:100vh; flex-direction: column; background:#0b141a; }
   .screen.active { display: flex; }
    
    /* LOGIN */
   .login-box { background: #202c33; margin: auto; padding: 30px 25px; border-radius: 15px; width: 90%; max-width: 400px; text-align: center; }
   .login-box h2 { color: #00a884; margin-bottom: 15px; font-size: 28px; }
   .login-box p { color: #aebac1; font-size:14px; margin-bottom:20px; }
    input { width: 100%; padding: 14px; margin: 10px 0; border-radius: 8px; border: none; background:#2a3942; color:#e9edef; font-size: 16px; outline: none; }
    button { width: 100%; padding: 14px; background: #00a884; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; }
    #status { color:#00a884; margin-top:10px; font-size:14px; min-height:20px; }

    /* HEADER */
   .header { background: #202c33; color: white; padding: 15px; display:flex; justify-content:space-between; align-items:center; }
   .header h1 { font-size: 20px; font-weight:500; }
   .header-icons { display:flex; gap:20px; font-size:22px; }

    /* SEARCH */
   .search { background: #111b21; padding: 8px 12px; }
   .search input { background: #202c33; border-radius: 18px; padding:10px 15px; margin:0; }

    /* TABS */
   .tabs { display:flex; background:#202c33; border-bottom:1px solid #111b21; }
   .tab { flex:1; text-align:center; padding:12px; font-size:14px; color:#8696a0; cursor:pointer; }
   .tab.active { color:#00a884; border-bottom:3px solid #00a884; }

    /* CHAT LIST */
   .chat-list { flex:1; overflow-y:auto; background:#111b21; }
   .chat-item { display:flex; padding:12px; gap:12px; cursor:pointer; border-bottom:1px solid #202c33; }
   .chat-item:active { background:#202c33; }
   .avatar { width:50px; height:50px; border-radius:50%; background:#00a884; display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:20px; flex-shrink:0; }
   .chat-info { flex:1; overflow:hidden; }
   .chat-top { display:flex; justify-content:space-between; }
   .chat-name { font-size:16px; font-weight:500; }
   .chat-time { font-size:12px; color:#8696a0; }
   .chat-preview { font-size:14px; color:#8696a0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    /* ADD CONTACT BAR */
   .add-bar { background:#202c33; padding:10px; display:flex; gap:8px; }
   .add-bar input { flex:1; margin:0; }
   .add-bar button { width:80px; }

    /* CHAT SCREEN */
   .chat-header { background:#202c33; padding:12px; display:flex; align-items:center; gap:12px; }
   .chat-area { flex:1; background:#0b141a; padding:15px; overflow-y:auto; background-image: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg=='); }
   .msg { margin: 8px 0; display: flex; }
   .msg.you { justify-content: flex-end; }
   .bubble { max-width: 75%; padding: 8px 12px; border-radius: 8px; background: #202c33; box-shadow: 0 1px 0.5px rgba(0,0,0,0.13); }
   .msg.you.bubble { background: #005c4b; }
   .input-area { background: #202c33; padding: 10px; display: flex; gap: 8px; }
   .input-area input { flex: 1; padding: 12px 16px; border-radius: 25px; margin:0; }
   .input-area button { width: 50px; height:50px; border-radius: 50%; font-size:24px; padding:0; }

   .bottom-nav { display:flex; background:#202c33; border-top:1px solid #111b21; }
   .nav-item { flex:1; text-align:center; padding:10px; font-size:12px; color:#8696a0; cursor:pointer; }
   .nav-item.active { color:#00a884; }
  </style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div class="screen active" id="loginScreen">
  <div class="login-box">
    <h2>LINKup 💜</h2>
    <p>Enter email. We go send magic link</p>
    <input id="email" type="email" placeholder="Enter Email">
    <input id="name" type="text" placeholder="Enter Your Name">
    <button onclick="sendMagicLink()">Send Magic Link</button>
    <p id="status"></p>
  </div>
</div>

<!-- MAIN SCREEN -->
<div class="screen" id="mainScreen">
  <div class="header">
    <h1>LINKup</h1>
    <div class="header-icons">📷 ⋮</div>
  </div>
  <div class="search"><input placeholder="Ask Meta AI or Search"></div>
  
  <div class="tabs">
    <div class="tab active">Chats</div>
    <div class="tab">Updates</div>
    <div class="tab">Communities</div>
    <div class="tab">Calls</div>
  </div>

  <div class="add-bar">
    <input id="newContact" placeholder="Add friend email">
    <button onclick="addContact()">Add</button>
  </div>

  <div class="chat-list" id="chatList"></div>

  <div class="bottom-nav">
    <div class="nav-item active">💬 Chats</div>
    <div class="nav-item">🔄 Updates</div>
    <div class="nav-item">👥 Communities</div>
    <div class="nav-item">📞 Calls</div>
  </div>
</div>

<!-- CHAT SCREEN -->
<div class="screen" id="chatScreen">
  <div class="chat-header">
    <span onclick="backToMain()" style="font-size:24px; cursor:pointer;">←</span>
    <div class="avatar" id="chatAvatar">M</div>
    <div id="chatName">Contact</div>
  </div>
  <div class="chat-area" id="chatArea"></div>
  <div class="input-area">
    <input id="msgInput" placeholder="Message" onkeypress="if(event.key==='Enter') sendMessage()">
    <button onclick="sendMessage()">➤</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";
import { getAuth, sendSignInLinkToEmail, isSignInWithEmailLink, signInWithEmailLink, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, set, push, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDyhQhEncYDaQscOtMrxz9Uj_-0-6XR-_s",
  authDomain: "linkup-chat-3fdd5.firebaseapp.com",
  databaseURL: "https://linkup-chat-3fdd5-default-rtdb.firebaseio.com",
  projectId: "linkup-chat-3fdd5",
  storageBucket: "linkup-chat-3fdd5.firebasestorage.app",
  messagingSenderId: "177573067619",
  appId: "1:177573067619:web:40e64ae330bb86200e7156",
  measurementId: "G-Q73V61VYEQ"
};
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
const auth = getAuth(app);
const db = getDatabase(app);

let currentUser = null; let contacts = []; let activeContact = null;

const actionCodeSettings = { url: 'https://pagecom382.github.io/linkup-app1/', handleCodeInApp: true };

window.sendMagicLink = async function(){
  let email = document.getElementById('email').value.trim();
  let name = document.getElementById('name').value.trim();
  if(!email ||!name) return document.getElementById('status').innerText = "Fill email and name";
  localStorage.setItem('linkup_email', email); localStorage.setItem('linkup_name', name);
  document.getElementById('status').innerText = "Sending magic link...";
  sendSignInLinkToEmail(auth, email, actionCodeSettings)
 .then(() => { document.getElementById('status').innerText = "Link sent! Check email"; document.getElementById('status').style.color = "green"; })
 .catch(err => { document.getElementById('status').innerText = "Error: " + err.message; });
}

if(isSignInWithEmailLink(auth, window.location.href)){
  let email = localStorage.getItem('linkup_email'); let name = localStorage.getItem('linkup_name');
  if(email){ signInWithEmailLink(auth, email, window.location.href).then((result) => {
    currentUser = { email: result.user.email, name: name, id: result.user.uid };
    set(ref(db, 'users/' + currentUser.id), { email: email, name: name });
    localStorage.removeItem('linkup_email'); localStorage.removeItem('linkup_name'); showMainScreen();
  });}
onAuthStateChanged(auth, (user) => { if(user){ currentUser = { email: user.email, name: user.displayName || "User", id: user.uid }; showMainScreen(); } });

function showMainScreen(){
  document.getElementById('loginScreen').classList.remove('active');
  document.getElementById('mainScreen').classList.add('active');
  loadChatList();
}

window.addContact = function(){
  let email = document.getElementById('newContact').value;
  if(email && currentUser){ set(ref(db, 'users/' + currentUser.id + '/contacts/' + btoa(email)), email); document.getElementById('newContact').value = ""; }
}

function loadChatList(){
  onValue(ref(db, 'users/' + currentUser.id + '/contacts'), snap => {
    contacts = snap.val()? Object.values(snap.val()) : [];
    let html = "";
    contacts.forEach(c => {
      let name = c.split('@')[0];
      html += `<div class="chat-item" onclick="openChat('${c}')">
        <div class="avatar">${name[0].toUpperCase()}</div>
        <div class="chat-info">
          <div class="chat-top"><div class="chat-name">${c}</div><div class="chat-time">now</div></div>
          <div class="chat-preview">Tap to chat</div>
        </div>
      </div>`;
    });
    document.getElementById('chatList').innerHTML = html || "<p style='text-align:center;padding:20px;color:#8696a0;'>Add a contact to start chatting</p>";
  });
}

window.openChat = function(email){
  activeContact = email;
  document.getElementById('mainScreen').classList.remove('active');
  document.getElementById('chatScreen').classList.add('active');
  document.getElementById('chatName').innerText = email;
  document.getElementById('chatAvatar').innerText = email[0].toUpperCase();
  onValue(ref(db, 'chats/' + chatId()), snap => {
    let html = ""; snap.forEach(child => {
      let m = child.val();
      html += `<div class="msg ${m.sender===currentUser.email?'you':''}"><div class="bubble">${m.text}</div></div>`;
    });
    document.getElementById('chatArea').innerHTML = html;
    document.getElementById('chatArea').scrollTop = document.getElementById('chatArea').scrollHeight;
  });
}

window.backToMain = function(){
  document.getElementById('chatScreen').classList.remove('active');
  document.getElementById('mainScreen').classList.add('active');
}

function chatId(){ return btoa([currentUser.email, activeContact].sort().join("_")); }

window.sendMessage = function(){
  let text = document.getElementById('msgInput').value;
  if(text && activeContact && currentUser){
    push(ref(db, 'chats/' + chatId()), { sender: currentUser.email, text: text, time: Date.now() });
    document.getElementById('msgInput').value = "";
  }
}
</script>
</body>
</html>
