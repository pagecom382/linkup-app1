<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LINKup</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#8b5cf6">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: #8b5cf6; height: 100vh; }
   .screen { display: none; height: 100vh; flex-direction: column; }
   .screen.active { display: flex; }
   .header { background: #7c3aed; color: white; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; }
   .login-box { background: white; margin: auto; padding: 30px; border-radius: 15px; width: 90%; max-width: 400px; text-align: center; }
   .login-box input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid #ddd; }
   .login-box button { width: 100%; padding: 12px; background: #8b5cf6; color: white; border: none; border-radius: 10px; font-weight: bold; }
   .contacts { background: white; padding: 10px; display: flex; gap: 10px; overflow-x: auto; }
   .contact { background: #eee; padding: 8px 15px; border-radius: 20px; cursor: pointer; white-space: nowrap; }
   .contact.active { background: #8b5cf6; color: white; }
   .chat-area { flex: 1; background: #e5ddd5; padding: 15px; overflow-y: auto; }
   .msg { margin: 8px 0; display: flex; }
   .msg.you { justify-content: flex-end; }
   .bubble { max-width: 75%; padding: 10px 14px; border-radius: 12px; background: white; color: #333; }
   .msg.you .bubble { background: #dcf8c6; }
   .input-area { background: white; padding: 10px; display: flex; gap: 8px; }
   .input-area input { flex: 1; padding: 12px; border-radius: 25px; border: 1px solid #ddd; }
   .input-area button { background: #8b5cf6; color: white; border: none; border-radius: 50%; width: 45px; height: 45px; font-size: 20px; }
   .add-contact { padding: 10px; background: white; display: flex; gap: 8px; }
   .add-contact input { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid #ddd; }
   .add-contact button { background: #8b5cf6; color: white; border: none; padding: 10px 15px; border-radius: 10px; }
   .logout { position: absolute; top: 15px; right: 15px; color: white; cursor: pointer; }
  </style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div class="screen active" id="loginScreen">
  <div class="login-box">
    <h2>LINKup 💜</h2>
    <p>Login with Email</p>
    <input id="email" type="email" placeholder="Enter your email">
    <button id="sendCodeBtn" onclick="sendCode()">Send Code</button>
    <input id="code" type="text" placeholder="Enter 6-digit code" style="display:none;">
    <button id="verifyBtn" onclick="verifyCode()" style="display:none;">Verify</button>
    <p id="status" style="color:#8b5cf6; margin-top:10px;"></p>
  </div>
</div>

<!-- CHAT SCREEN -->
<div class="screen" id="chatScreen">
  <div class="header">LINKup 💜 <span class="logout" onclick="logout()">Logout</span></div>
  <div class="add-contact">
    <input id="newContact" placeholder="Add person email">
    <button onclick="addContact()">Add</button>
  </div>
  <div class="contacts" id="contacts"></div>
  <div class="chat-area" id="chatArea"><p style="text-align:center; color:#666;">Select a person to start chatting</p></div>
  <div class="input-area">
    <input id="msgInput" placeholder="Type a message" onkeypress="if(event.key==='Enter') sendMessage()">
    <button onclick="sendMessage()">➤</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, set, push, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDyhQhEncYDaQscOtMrxz9Uj_-0-6XR-_s",
  authDomain: "linkup-chat-3fdd5.firebaseapp.com",
  databaseURL: "https://linkup-chat-3fdd5-default-rtdb.firebaseio.com",
  projectId: "linkup-chat-3fdd5",
  storageBucket: "linkup-chat-3fdd5.firebasestorage.app",
  messagingSenderId: "177573067619",
  appId: "1:177573067619:web:40e64ae330bb86200e7156",
  measurementId: "G-Q73V61VYEQ"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let currentUser = null;
let contacts = [];
let activeContact = null;

// Check if user dey login already
onAuthStateChanged(auth, user => {
  if(user){
    currentUser = user;
    document.getElementById('loginScreen').classList.remove('active');
    document.getElementById('chatScreen').classList.add('active');
    loadContacts();
  }
});

window.sendCode = async function(){
  let email = document.getElementById('email').value;
  document.getElementById('status').innerText = "Creating account...";
  try{
    await createUserWithEmailAndPassword(auth, email, "123456"); // default password
    document.getElementById('code').style.display = "block";
    document.getElementById('verifyBtn').style.display = "block";
    document.getElementById('status').innerText = "Account created. Enter any 6 digits to continue";
  } catch(e){
    await signInWithEmailAndPassword(auth, email, "123456");
  }
}

window.verifyCode = function(){
  document.getElementById('status').innerText = "Logged in!";
}

window.logout = function(){
  signOut(auth);
  location.reload();
}

window.addContact = function(){
  let email = document.getElementById('newContact').value;
  if(email){
    set(ref(db, 'users/' + currentUser.uid + '/contacts/' + email), true);
    document.getElementById('newContact').value = "";
  }
}

function loadContacts(){
  onValue(ref(db, 'users/' + currentUser.uid + '/contacts'), snap => {
    contacts = snap.val() ? Object.keys(snap.val()) : [];
    renderContacts();
  });
}

function renderContacts(){
  let html = "";
  contacts.forEach(c => {
    html += `<div class="contact ${activeContact===c?'active':''}" onclick="selectContact('${c}')">${c}</div>`;
  });
  document.getElementById('contacts').innerHTML = html;
}

window.selectContact = function(email){
  activeContact = email;
  renderContacts();
  onValue(ref(db, 'chats/' + chatId()), snap => {
    let html = "";
    snap.forEach(child => {
      let m = child.val();
      html += `<div class="msg ${m.sender===currentUser.email?'you':''}"><div class="bubble">${m.text}</div></div>`;
    });
    document.getElementById('chatArea').innerHTML = html;
  });
}

function chatId(){
  return [currentUser.email, activeContact].sort().join("_");
}

window.sendMessage = function(){
  let text = document.getElementById('msgInput').value;
  if(text && activeContact){
    push(ref(db, 'chats/' + chatId()), {
      sender: currentUser.email,
      text: text,
      time: Date.now()
    });
    document.getElementById('msgInput').value = "";
  }
}
</script>
</body>
</html>
