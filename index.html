<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LINKup</title>
  <meta name="theme-color" content="#8b5cf6">
  <style>
    body { background: #8b5cf6; margin:0; font-family:sans-serif; }
   .login-box { background: white; margin: 100px auto; padding: 30px; border-radius: 15px; width: 90%; max-width: 400px; text-align: center; }
   input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid #ddd; }
   button { width: 100%; padding: 12px; background: #8b5cf6; color: white; border: none; border-radius: 10px; font-weight: bold; }
   #status { color:red; margin-top:10px; font-size:14px; }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>LINKup 💜</h2>
    <input id="email" type="email" placeholder="Email" value="maroejiata02@gmail.com">
    <input id="password" type="password" placeholder="Password" value="123456">
    <button onclick="login()">Continue</button>
    <p id="status"></p>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDyhQhEncYDaQscOtMrxz9Uj_-0-6XR-_s",
  authDomain: "linkup-chat-3fdd5.firebaseapp.com",
  projectId: "linkup-chat-3fdd5"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.login = async function(){
  let email = document.getElementById('email').value;
  let pass = document.getElementById('password').value;
  document.getElementById('status').innerText = "Logging in...";
  try{
    await createUserWithEmailAndPassword(auth, email, pass);
    document.getElementById('status').innerText = "Account Created! Refresh page";
  } catch(e){
    document.getElementById('status').innerText = "Error 1: " + e.code + " - " + e.message;
    try{
      await signInWithEmailAndPassword(auth, email, pass);
      document.getElementById('status').innerText = "Login Success! Refresh page";
    } catch(err){
      document.getElementById('status').innerText = "Error 2: " + err.code + " - " + err.message;
    }
  }
}
</script>
</body>
</html>
