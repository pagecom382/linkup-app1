<!DOCTYPE html>
<html>
<head>
  <title>LinkUp Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; background: #0a0a0a; color: white; margin: 0; }
    .box { background: #1a1a1a; padding: 30px; border-radius: 15px; width: 90%; max-width: 400px; }
    input, button { width: 100%; padding: 14px; margin: 10px 0; border-radius: 8px; border: none; font-size: 16px; box-sizing: border-box; }
    input { background: #2a2a2a; color: white; }
    button { background: #25D366; color: white; font-weight: bold; cursor: pointer; }
    button:disabled { background: #555; cursor: not-allowed; }
    #msg { text-align: center; margin-top: 10px; color: #25D366; }
  </style>
</head>
<body>
  <div class="box">
    <h2 style="text-align:center">LinkUp 🔥</h2>
    <div id="step1">
      <input type="tel" id="phone" placeholder="+2347067087764" value="+234">
      <div id="recaptcha-container"></div>
      <button id="sendBtn" onclick="sendOTP()">Send verification code</button>
    </div>
    <div id="step2" style="display:none">
      <input type="text" id="code" placeholder="Enter 6 digit code" maxlength="6">
      <button onclick="verifyOTP()">Verify</button>
    </div>
    <p id="msg"></p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, RecaptchaVerifier, signInWithPhoneNumber } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";

    // YOUR REAL CONFIG
    const firebaseConfig = {
      apiKey: "AIzaSyDyhQhEncYDaQscOtMrxz9Uj_-0-6XR-_s",
      authDomain: "linkup-chat-3fdd5.firebaseapp.com",
      databaseURL: "https://linkup-chat-3fdd5-default-rtdb.firebaseio.com",
      projectId: "linkup-chat-3fdd5",
      storageBucket: "linkup-chat-3fdd5.firebasestorage.app",
      messagingSenderId: "177573067619",
      appId: "1:177573067619:web:40e64ae330bb86200e7156",
      measurementId: "G-Q73V61VYEQ"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const auth = getAuth(app);
    let confirmationResult;

    // Invisible reCAPTCHA
    window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', {
      'size': 'invisible'
    });

    window.sendOTP = () => {
      const phone = document.getElementById('phone').value;
      document.getElementById('msg').innerText = "Sending...";
      document.getElementById('sendBtn').disabled = true;
      
      signInWithPhoneNumber(auth, phone, window.recaptchaVerifier)
        .then((result) => {
          confirmationResult = result;
          document.getElementById('step1').style.display = 'none';
          document.getElementById('step2').style.display = 'block';
          document.getElementById('msg').innerText = "Code sent! Check SMS";
        }).catch((error) => {
          document.getElementById('msg').innerText = "Error: " + error.message;
          document.getElementById('sendBtn').disabled = false;
          window.recaptchaVerifier.clear();
        });
    }

    window.verifyOTP = () => {
      const code = document.getElementById('code').value;
      confirmationResult.confirm(code).then((result) => {
        document.getElementById('msg').innerText = "Login Success! Welcome to LinkUp";
      }).catch((error) => {
        document.getElementById('msg').innerText = "Wrong code: " + error.message;
      });
    }
  </script>
</body>
</html>
