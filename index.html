<!DOCTYPE html>
<html>
<head>
  <title>LinkUp Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; background: #0a0a0a; color: white; }
    .box { background: #1a1a1a; padding: 30px; border-radius: 15px; width: 90%; max-width: 400px; }
    input, button { width: 100%; padding: 14px; margin: 10px 0; border-radius: 8px; border: none; font-size: 16px; }
    input { background: #2a2a2a; color: white; }
    button { background: #25D366; color: white; font-weight: bold; cursor: pointer; }
    button:disabled { background: #555; cursor: not-allowed; }
    #recaptcha-container { margin: 10px 0; }
  </style>
</head>
<body>
  <div class="box">
    <h2>LinkUp 🔥</h2>
    <div id="step1">
      <input type="tel" id="phone" placeholder="+2347067087764" value="+234">
      <div id="recaptcha-container"></div>
      <button id="sendBtn" onclick="sendOTP()">Send verification code</button>
    </div>
    <div id="step2" style="display:none">
      <input type="text" id="code" placeholder="Enter 6 digit code">
      <button onclick="verifyOTP()">Verify</button>
    </div>
    <p id="msg"></p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, RecaptchaVerifier, signInWithPhoneNumber } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    let confirmationResult;

    // Force invisible reCAPTCHA to load immediately
    window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', {
      'size': 'invisible',
      'callback': () => { document.getElementById('sendBtn').disabled = false; }
    });
    recaptchaVerifier.render();

    window.sendOTP = () => {
      const phone = document.getElementById('phone').value;
      document.getElementById('msg').innerText = "Sending...";
      document.getElementById('sendBtn').disabled = true;
      
      signInWithPhoneNumber(auth, phone, window.recaptchaVerifier)
        .then((result) => {
          confirmationResult = result;
          document.getElementById('step1').style.display = 'none';
          document.getElementById('step2').style.display = 'block';
          document.getElementById('msg').innerText = "Code sent! Check SMS";
        }).catch((error) => {
          document.getElementById('msg').innerText = "Error: " + error.message;
          document.getElementById('sendBtn').disabled = false;
          recaptchaVerifier.clear();
          window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', {'size': 'invisible'});
        });
    }

    window.verifyOTP = () => {
      const code = document.getElementById('code').value;
      confirmationResult.confirm(code).then((result) => {
        document.getElementById('msg').innerText = "Login Success! Welcome";
      }).catch((error) => {
        document.getElementById('msg').innerText = "Wrong code";
      });
    }
  </script>
</body>
</html>
