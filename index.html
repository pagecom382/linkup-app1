<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LINKup</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#8b5cf6">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: #8b5cf6; height: 100vh; display: flex; flex-direction: column; }
   .header { background: #7c3aed; color: white; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; }
   .contacts { background: white; padding: 10px; display: flex; gap: 10px; overflow-x: auto; }
   .contact { background: #eee; padding: 8px 15px; border-radius: 20px; cursor: pointer; white-space: nowrap; }
   .contact.active { background: #8b5cf6; color: white; }
   .chat-area { flex: 1; background: #e5ddd5; padding: 15px; overflow-y: auto; }
   .msg { margin: 8px 0; display: flex; }
   .msg.you { justify-content: flex-end; }
   .bubble { max-width: 75%; padding: 10px 14px; border-radius: 12px; background: white; color: #333; }
   .msg.you.bubble { background: #dcf8c6; }
   .input-area { background: white; padding: 10px; display: flex; gap: 8px; }
   .input-area input { flex: 1; padding: 12px; border-radius: 25px; border: 1px solid #ddd; outline: none; }
   .input-area button { background: #8b5cf6; color: white; border: none; border-radius: 50%; width: 45px; height: 45px; font-size: 20px; cursor: pointer; }
   .add-contact { padding: 10px; background: white; display: flex; gap: 8px; }
   .add-contact input { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid #ddd; }
   .add-contact button { background: #8b5cf6; color: white; border: none; padding: 10px 15px; border-radius: 10px; }
  </style>
</head>
<body>
  <div class="header">LINKup 💜</div>
  
  <div class="add-contact">
    <input id="newContact" placeholder="Add person name">
    <button onclick="addContact()">Add</button>
  </div>

  <div class="contacts" id="contacts"></div>

  <div class="chat-area" id="chatArea">
    <p style="text-align:center; color:#666;">Select a person to start chatting</p>
  </div>

  <div class="input-area">
    <input id="msgInput" placeholder="Type a message" onkeypress="if(event.key==='Enter') sendMessage()">
    <button onclick="sendMessage()">➤</button>
  </div>

<script>
let contacts = [];
let activeContact = null;
let messages = {};

function addContact(){
  let name = document.getElementById('newContact').value.trim();
  if(name &&!contacts.includes(name)){
    contacts.push(name);
    messages[name] = [];
    document.getElementById('newContact').value = "";
    renderContacts();
  }
}

function renderContacts(){
  let html = "";
  contacts.forEach(c => {
    html += `<div class="contact ${activeContact===c?'active':''}" onclick="selectContact('${c}')">${c}</div>`;
  });
  document.getElementById('contacts').innerHTML = html;
}

function selectContact(name){
  activeContact = name;
  renderContacts();
  renderMessages();
}

function sendMessage(){
  let text = document.getElementById('msgInput').value.trim();
  if(text && activeContact){
    messages[activeContact].push({sender: 'you', text});
    document.getElementById('msgInput').value = "";
    renderMessages();
  }
}

function renderMessages(){
  if(!activeContact) return;
  let html = "";
  messages[activeContact].forEach(m => {
    html += `<div class="msg ${m.sender==='you'?'you':''}"><div class="bubble">${m.text}</div></div>`;
  });
  document.getElementById('chatArea').innerHTML = html;
  document.getElementById('chatArea').scrollTop = document.getElementById('chatArea').scrollHeight;
}
</script>
</body>
</html>
