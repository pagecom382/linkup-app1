<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>LinkUp 🔮</title>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto}
:root{--purple:#8B5CF6;--purple2:#7C3AED;--dark:#0a0a0f;--dark2:#111118;--card:#1a1a24;--text:#ffffff;--muted:#a1a1aa}
body{background:var(--dark);color:var(--text);height:100vh;overflow:hidden}
button,input{font:inherit}button{border:0;cursor:pointer}.hidden{display:none!important}
#authScreen{width:100%;height:100vh;display:flex;justify-content:center;align-items:center;background:var(--dark);padding:20px}
.authBox{width:100%;max-width:400px;background:var(--card);padding:35px 30px;border-radius:20px;box-shadow:0 0 40px rgba(139,92,246,0.3);border:1px solid rgba(139,92,246,0.2)}
.logo{text-align:center;margin-bottom:30px}
.logo h1{font-size:32px;font-weight:800;background:linear-gradient(135deg,#8B5CF6,#A855F7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo p{color:var(--muted);margin-top:8px;font-size:14px}
.authCard h2{margin-bottom:20px;font-size:22px}
.authCard input{width:100%;background:var(--dark2);color:white;border:1px solid #2a2a3a;padding:14px;border-radius:12px;margin-bottom:12px;outline:none;font-size:15px}
.authCard input:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(139,92,246,0.1)}
.primary{width:100%;background:linear-gradient(135deg,var(--purple),var(--purple2));color:white;padding:14px;border-radius:12px;font-weight:700;font-size:16px}
.switch{text-align:center;margin-top:18px;color:var(--purple);cursor:pointer;font-weight:500}
.userIdBox{background:linear-gradient(135deg,rgba(139,92,246,0.1),rgba(168,85,247,0.1));padding:20px;border-radius:15px;margin-top:15px;text-align:center;border:1px solid rgba(139,92,246,0.3)}
.userIdBox strong{font-size:20px;color:var(--purple);letter-spacing:2px;font-weight:800}
.copyBtn{background:var(--purple);color:white;padding:10px 16px;border-radius:10px;font-size:14px;margin-top:12px;font-weight:600}
#app{height:100vh;display:flex}
.sidebar{width:380px;min-width:320px;background:var(--card);border-right:1px solid #2a2a3a;display:flex;flex-direction:column}
.topbar{height:65px;background:var(--dark2);display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #2a2a3a}
.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--purple),var(--purple2));display:flex;justify-content:center;align-items:center;font-weight:bold;font-size:18px}
.icons{display:flex;gap:18px}
.iconBtn{background:none;color:#a1a1aa;font-size:24px}
.searchBox{padding:12px;background:var(--card)}
.search{width:100%;background:var(--dark2);border:1px solid #2a2a3a;border-radius:10px;color:white;padding:12px 15px;outline:none}
.chatList{overflow-y:auto;flex:1}
.chatItem{display:flex;align-items:center;padding:14px 18px;gap:12px;border-bottom:1px solid #1f1f28;cursor:pointer}
.chatItem:hover{background:var(--dark2)}
.chatInfo{flex:1;min-width:0}
.chatName{font-size:16px;font-weight:600}
.lastMessage{color:var(--muted);font-size:13px;margin-top:4px}
.chat{flex:1;display:flex;flex-direction:column;background:var(--dark)}
.chatHeader{height:65px;background:var(--dark2);display:flex;align-items:center;padding:0 18px;gap:12px;border-bottom:1px solid #2a2a3a}
.messages{flex:1;overflow-y:auto;padding:20px}
.empty{height:100%;display:flex;justify-content:center;align-items:center;color:var(--muted);text-align:center}
.messageRow{display:flex;margin-bottom:8px}
.messageRow.me{justify-content:flex-end}
.bubble{max-width:70%;padding:10px 14px;border-radius:15px;background:var(--card)}
.me.bubble{background:linear-gradient(135deg,var(--purple),var(--purple2))}
.messageText{font-size:15px;line-height:1.4}
.messageMeta{float:right;margin-left:8px;margin-top:4px;color:rgba(255,255,255,0.6);font-size:11px}
.composer{min-height:70px;background:var(--dark2);display:flex;align-items:center;gap:10px;padding:12px 15px;border-top:1px solid #2a2a3a}
.composer input{flex:1;background:var(--card);border:1px solid #2a2a3a;color:white;padding:14px 18px;border-radius:25px;outline:none}
.sendBtn{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--purple),var(--purple2));color:white;font-size:20px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;justify-content:center;align-items:center;z-index:50}
.modalBox{width:90%;max-width:400px;background:var(--card);padding:25px;border-radius:18px;border:1px solid rgba(139,92,246,0.2)}
.closeBtn{margin-top:10px;width:100%;padding:12px;background:#2a2a3a;color:white;border-radius:10px}
@media(max-width:700px){.sidebar{width:100%;min-width:0}.chat{position:absolute;inset:0;transform:translateX(100%);transition:.2s;z-index:10}.chat.open{transform:translateX(0)}.bubble{max-width:85%}}
</style>
</head>
<body>

<section id="authScreen">
<div class="authBox">
<div class="logo"><h1>LinkUp 🔮</h1><p>Connect with destiny</p></div>
<div class="authCard">
<div id="loginForm"><h2>Sign in</h2><input id="loginEmail" type="email" placeholder="Email"><input id="loginPassword" type="password" placeholder="Password"><button class="primary" onclick="login()">Sign in</button><div class="switch" onclick="showRegister()">Create new account</div></div>
<div id="registerForm" class="hidden"><h2>Create account</h2><input id="registerName" type="text" placeholder="Your name"><input id="registerEmail" type="email" placeholder="Email"><input id="registerPassword" type="password" placeholder="Password"><button class="primary" onclick="register()">Create account</button><div class="switch" onclick="showLogin()">Already have an account?</div></div>
<div id="userIdScreen" class="hidden">
    <h2>Your LinkUp ID</h2>
    <p style="color:var(--muted);margin-bottom:15px;font-size:14px">Send this ID to friends to add them</p>
    <div class="userIdBox"><strong id="myUserId">LU_XXXXXX</strong><br><button class="copyBtn" onclick="copyUserId()">Copy ID</button></div>
    <button class="primary" style="margin-top:20px" onclick="enterApp()">Continue to LinkUp</button>
</div>
</div></div></section>

<section id="app" class="hidden">
<aside class="sidebar">
<div class="topbar"><div style="display:flex;align-items:center;gap:12px"><div class="avatar" id="myAvatar">👤</div><strong id="myName">LinkUp</strong></div><div class="icons"><button class="iconBtn" onclick="openNewChat()">+</button><button class="iconBtn" onclick="logout()">⋮</button></div></div>
<div class="searchBox"><input class="search" placeholder="Search by User ID"></div>
<div id="chatList" class="chatList"><div class="empty">No chats yet.<br>Tap + to add someone</div></div>
</aside>
<main id="chatPanel" class="chat">
<div class="chatHeader"><div class="avatar" id="chatAvatar">👤</div><div><div class="chatName" id="chatName">Select a chat</div><div style="color:var(--muted);font-size:12px" id="chatStatus">online</div></div></div>
<div id="messages" class="messages"><div class="empty"><div><h2>Welcome to LinkUp</h2><p>Your ID: <strong style="color:var(--purple)" id="welcomeUserId"></strong></p></div></div></div>
<div class="composer"><input id="messageInput" placeholder="Type a message" onkeydown="if(event.key==='Enter')sendMessage()"><button class="sendBtn" onclick="sendMessage()">➤</button></div>
</main>
</section>

<div id="newChatModal" class="modal hidden"><div class="modalBox"><h2>Add by User ID</h2><input id="userSearch" placeholder="Enter User ID e.g LU_8F3K2P"><button class="primary" onclick="findUser()">Find User</button><div id="userResult"></div><button class="closeBtn" onclick="closeNewChat()">Cancel</button></div></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDyhQhEncYDaQscOtMrxz9Uj_-0-6XR-_s",
  authDomain: "linkup-chat-3fdd5.firebaseapp.com",
  projectId: "linkup-chat-3fdd5",
  storageBucket: "linkup-chat-3fdd5.firebasestorage.app",
  messagingSenderId: "177573067619",
  appId: "1:177573067619:web:40e64ae330bb86200e7156"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let currentUser = null;
let currentChatUser = null;
let myUserId = "";

function generateUserId(){return "LU_" + Math.random().toString(36).substring(2,8).toUpperCase();}

auth.onAuthStateChanged(async user => {
    if(user && user.emailVerified){
        currentUser = user;
        const userDoc = await db.collection("users").doc(user.uid).get();
        if(userDoc.exists){myUserId = userDoc.data().userId;showMainApp();}
    }else{
        document.getElementById("authScreen").classList.remove("hidden");
        document.getElementById("app").classList.add("hidden");
    }
});

async function login(){
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;
    if(!email ||!password){alert("Enter email and password.");return;}
    try{
        const result = await auth.signInWithEmailAndPassword(email,password);
        if(!result.user.emailVerified){
            alert("Please verify your email first. Check inbox/spam.");
            await auth.signOut();
            return;
        }
    }catch(e){alert(e.message);}
}

async function register(){
    const name = document.getElementById("registerName").value.trim();
    const email = document.getElementById("registerEmail").value.trim();
    const password = document.getElementById("registerPassword").value;
    if(!name ||!email ||!password){alert("Complete all fields.");return;}
    if(password.length < 6){alert("Password must be 6+ characters.");return;}
    try{
        const result = await auth.createUserWithEmailAndPassword(email,password);
        await result.user.sendEmailVerification(); // SEND VERIFICATION EMAIL

        myUserId = generateUserId();
        await db.collection("users").doc(result.user.uid).set({
            uid:result.user.uid,name:name,email:email.toLowerCase(),
            userId:myUserId,verified:false,online:true,
            createdAt:firebase.firestore.FieldValue.serverTimestamp()
        });
        await db.collection("userIds").doc(myUserId).set({uid:result.user.uid});

        alert("Account created! Check your email to verify before login.");
        await auth.signOut();
        showLogin();

    }catch(e){alert(e.message);}
}

function showMainApp(){
    document.getElementById("authScreen").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    document.getElementById("welcomeUserId").textContent = myUserId;
    loadMyProfile();loadChats();
}

function copyUserId(){navigator.clipboard.writeText(myUserId);alert("Copied: " + myUserId);}
function enterApp(){showMainApp();}
function loadMyProfile(){db.collection("users").doc(currentUser.uid).onSnapshot(doc => {const data = doc.data();if(!data)return;document.getElementById("myName").textContent = data.name||"LinkUp";});}
async function logout(){await auth.signOut();}
function showRegister(){document.getElementById("loginForm").classList.add("hidden");document.getElementById("registerForm").classList.remove("hidden");}
function showLogin(){document.getElementById("registerForm").classList.add("hidden");document.getElementById("loginForm").classList.remove("hidden");}
function getChatId(uid1,uid2){return [uid1,uid2].sort().join("_");}
function openNewChat(){document.getElementById("newChatModal").classList.remove("hidden");}
function closeNewChat(){document.getElementById("newChatModal").classList.add("hidden");}

async function findUser(){
    const userId = document.getElementById("userSearch").value.trim().toUpperCase();
    const result = document.getElementById("userResult");
    if(!userId){result.innerHTML="<p style='margin-top:15px'>Enter a User ID.</p>";return;}
    const idSnap = await db.collection("userIds").doc(userId).get();
    if(!idSnap.exists){result.innerHTML="<p style='margin-top:15px;color:var(--muted)'>User ID not found.</p>";return;}
    const uid = idSnap.data().uid;
    if(uid === currentUser.uid){result.innerHTML="<p style='margin-top:15px'>That's you.</p>";return;}
    const userDoc = await db.collection("users").doc(uid).get();
    const user = userDoc.data();
    result.innerHTML=`<div style="margin-top:15px;padding:14px;background:var(--dark2);border-radius:12px;display:flex;align-items:center;gap:10px"><div class="avatar">👤</div><div style="flex:1"><strong>${user.name}</strong><div style="color:var(--muted);font-size:12px">ID: ${user.userId}</div></div><button class="primary" style="width:auto;padding:10px 16px" onclick='startChat(${JSON.stringify(user)})'>Chat</button></div>`;
}

async function startChat(user){
    currentChatUser = user;closeNewChat();
    document.getElementById("chatPanel").classList.add("open");
    document.getElementById("chatName").textContent = user.name;
    const chatId = getChatId(currentUser.uid,user.uid);
    await db.collection("chats").doc(chatId).set({users:[currentUser.uid,user.uid],updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
    loadMessages(chatId);
}

function loadMessages(chatId){
    db.collection("chats").doc(chatId).collection("messages").orderBy("createdAt","asc").onSnapshot(snapshot => {
        const messages = document.getElementById("messages");messages.innerHTML = "";
        if(snapshot.empty){messages.innerHTML=`<div class="empty">No messages yet. Say hi 👋</div>`;return;}
        snapshot.forEach(doc => {renderMessage(doc.data());});
        messages.scrollTop = messages.scrollHeight;
    });
}

function renderMessage(msg){
    const messages = document.getElementById("messages");
    const row = document.createElement("div");
    row.className = "messageRow " + (msg.senderId === currentUser.uid? "me" : "");
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerHTML = `<div class="messageText">${msg.text}</div><div class="messageMeta">${new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'})}</div>`;
    row.appendChild(bubble);messages.appendChild(row);
}

function sendMessage(){
    const input = document.getElementById("messageInput");
    const text = input.value.trim();
    if(!text ||!currentChatUser)return;
    const chatId = getChatId(currentUser.uid,currentChatUser.uid);
    db.collection("chats").doc(chatId).collection("messages").add({text:text,senderId:currentUser.uid,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    db.collection("chats").doc(chatId).update({updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
    input.value = "";
}

function loadChats(){
    db.collection("chats").where("users","array-contains",currentUser.uid).orderBy("updatedAt","desc").onSnapshot(snap => {
        const list = document.getElementById("chatList");
        if(snap.empty){list.innerHTML=`<div class="empty">No chats yet.<br>Tap + to add someone</div>`;return;}
        list.innerHTML = "";
        snap.forEach(doc => {
            const data = doc.data();
            const otherId = data.users.find(u=>u!==currentUser.uid);
            db.collection("users").doc(otherId).get().then(userDoc=>{const u = userDoc.data();list.innerHTML += `<div class="chatItem" onclick='startChat(${JSON.stringify(u)})'><div class="avatar">👤</div><div class="chatInfo"><div class="chatName">${u.name}</div><div class="lastMessage">ID: ${u.userId}</div></div></div>`;});
        });
    });
}
</script>
</body>
  </html>
