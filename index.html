<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LINKup</title>
  <meta name="theme-color" content="#8b5cf6">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { background: #8b5cf6; height:100vh; overflow:hidden; }
  .screen { display: none; height:100vh; flex-direction: column; }
  .screen.active { display: flex; }
  .login-box { background: white; margin: auto; padding: 30px 25px; border-radius: 20px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
  .login-box h2 { color: #8b5cf6; margin-bottom: 15px; font-size: 28px; }
  .login-box p { color: #666; font-size:14px; margin-bottom:20px; }
    input { width: 100%; padding: 14px; margin: 10px 0; border-radius: 12px; border: 1px solid #ddd; font-size: 16px; outline: none; text-align:center; }
    input:focus { border-color: #8b5cf6; }
    button { width: 100%; padding: 14px; background: #8b5cf6; color: white; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top:8px; }
    button:active { background: #7c3aed; }
    #status { color:#8b5cf6; margin-top:10px; font-size:14px; min-height:20px; font-weight:500; }
 .header { background: #7c3aed; color: white; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; position:relative; }
 .logout { position:absolute; right:15px; top:50%; transform:translateY(-50%); font-size:14px; cursor:pointer; background:rgba(255,255,255,0.2); padding:5px 10px; border-radius:15px; }
 .add-contact { padding: 10px; background: white; display: flex; gap: 8px; }
 .add-contact input { flex: 1; margin:0; text-align:left; }
 .add-contact button { width: 80px; margin:0; }
 .contacts { background: white; padding: 10px; display: flex; gap: 10px; overflow-x: auto; border-bottom: 1px solid #eee; }
 .contact { background: #f3f0ff; padding: 8px 15px; border-radius: 20px; cursor: pointer; white-space:nowrap; font-size:14px; }
 .contact.active { background: #8b5cf6; color: white; }
 .chat-area { flex: 1; background: #e5ddd5; padding: 15px; overflow-y: auto; }
 .msg { margin: 8px 0; display: flex; }
 .msg.you { justify-content: flex-end; }
 .bubble { max-width: 75%; padding: 10px 14px; border-radius: 12px; background: white; box-shadow: 0 1px 1px rgba(0,0,0,0.1); word-wrap:break-word; }
 .msg.you .bubble { background: #dcf8c6; }
 .input-area { background: white; padding: 10px; display: flex; gap: 8px; align-items:center; }
 .input-area input { flex: 1; padding: 12px 16px; border-radius: 25px; border: 1px solid #ddd; margin:0; text-align:left; }
 .input-area button { width: 55px; height:55px; border-radius: 50%; font-size:24px; padding:0; flex-shrink:0; margin:0; }
  </style>
</head>
<body>

<div class="screen active" id="loginScreen">
  <div class="login-box">
    <h2>LINKup 💜</h2>
    <p>Enter your email. We go send you magic link</p>
    <input id="email" type="email" placeholder="Enter Email">
    <input id="name" type="text" placeholder="Enter Your Name">
    <button onclick="sendMagicLink()">Send Magic Link</button>
    <p id="status"></p>
  </div>
</div>

<div class="screen" id="chatScreen">
  <div class="header">LINKup 💜 <span class="logout" onclick="logout()">Logout</span></div>
  <div class="add-contact">
    <input id="newContact" placeholder="Add friend email">
    <button onclick="addContact()">Add</button>
  </div>
  <div class="contacts" id="contacts"></div>
  <div class="chat-area" id="chatArea"><p style="text-align:center; color:#666; margin-top:20px;">Add a contact to start chatting</p></div>
  <div class="input-area">
    <input id="msgInput" placeholder="Type a message" onkeypress="if(event.key==='Enter') sendMessage()">
    <button onclick="sendMessage()">➤</button>
  </div>
</div>

<script type="module">
// Import the functions you need from the SDKs you need
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";
import { getAuth, sendSignInLinkToEmail, isSignInWithEmailLink, signInWithEmailLink, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, set, push, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// Your web app's Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyDyhQhEncYDaQscOtMrxz9Uj_-0-6XR-_s",
  authDomain: "linkup-chat-3fdd5.firebaseapp.com",
  databaseURL: "https://linkup-chat-3fdd5-default-rtdb.firebaseio.com",
  projectId: "linkup-chat-3fdd5",
  storageBucket: "linkup-chat-3fdd5.firebasestorage.app",
  messagingSenderId: "177573067619",
  appId: "1:177573067619:web:40e64ae330bb86200e7156",
  measurementId: "G-Q73V61VYEQ"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
const auth = getAuth(app);
const db = getDatabase(app);

let currentUser = null; let contacts = []; let activeContact = null;

// YOUR REAL LINK HERE
const actionCodeSettings = {
  url: 'https://pagecom382.github.io/linkup-app1/',
  handleCodeInApp: true
};

window.sendMagicLink = async function(){
  let email = document.getElementById('email').value.trim();
  let name = document.getElementById('name').value.trim();
  if(!email ||!name) return document.getElementById('status').innerText = "Fill email and name";
  if(!email.includes("@")) return document.getElementById('status').innerText = "Enter valid email";
  
  localStorage.setItem('linkup_email', email);
  localStorage.setItem('linkup_name', name);
  
  document.getElementById('status').innerText = "Sending magic link to " + email + "...";
  
  sendSignInLinkToEmail(auth, email, actionCodeSettings)
  .then(() => {
    document.getElementById('status').innerText = "Link sent! Check your email and click it";
    document.getElementById('status').style.color = "green";
  }).catch(err => {
    document.getElementById('status').innerText = "Error: " + err.message;
    document.getElementById('status').style.color = "red";
    console.log(err);
  });
}

// CHECK IF USER CLICKED THE LINK FROM EMAIL
if(isSignInWithEmailLink(auth, window.location.href)){
  let email = localStorage.getItem('linkup_email');
  let name = localStorage.getItem('linkup_name');
  if(email){
    signInWithEmailLink(auth, email, window.location.href)
    .then((result) => {
      currentUser = { email: result.user.email, name: name, id: result.user.uid };
      set(ref(db, 'users/' + currentUser.id), { email: email, name: name });
      localStorage.removeItem('linkup_email');
      localStorage.removeItem('linkup_name');
      showChatScreen();
    }).catch(err => {
      document.getElementById('status').innerText = "Login Error: " + err.message;
    });
  }
}

// CHECK IF USER ALREADY LOGGED IN
onAuthStateChanged(auth, (user) => {
  if(user){
    currentUser = { email: user.email, name: user.displayName || "User", id: user.uid };
    showChatScreen();
  }
});

function showChatScreen(){
  document.getElementById('loginScreen').classList.remove('active');
  document.getElementById('chatScreen').classList.add('active');
  loadContacts();
}

window.logout = function(){ 
  signOut(auth);
  location.reload();
}

window.addContact = function(){
  let email = document.getElementById('newContact').value;
  if(email && currentUser){ 
    set(ref(db, 'users/' + currentUser.id + '/contacts/' + btoa(email)), email); 
    document.getElementById('newContact').value = ""; 
  }
}

function loadContacts(){
  onValue(ref(db, 'users/' + currentUser.id + '/contacts'), snap => {
    contacts = snap.val()? Object.values(snap.val()) : [];
    let html = "";
    contacts.forEach(c => { 
      html += `<div class="contact ${c===activeContact?'active':''}" onclick="selectContact('${c}')">${c}</div>`; 
    });
    document.getElementById('contacts').innerHTML = html;
  });
}

window.selectContact = function(email){
  activeContact = email;
  document.querySelectorAll('.contact').forEach(el => el.classList.remove('active'));
  event.target.classList.add('active');
  onValue(ref(db, 'chats/' + chatId()), snap => {
    let html = "";
    snap.forEach(child => {
      let m = child.val();
      html += `<div class="msg ${m.sender===currentUser.email?'you':''}"><div class="bubble">${m.text}</div></div>`;
    });
    document.getElementById('chatArea').innerHTML = html || "<p style='text-align:center;color:#666;margin-top:20px;'>Say Hi!</p>";
    document.getElementById('chatArea').scrollTop = document.getElementById('chatArea').scrollHeight;
  });
}

function chatId(){ return btoa([currentUser.email, activeContact].sort().join("_")); }

window.sendMessage = function(){
  let text = document.getElementById('msgInput').value;
  if(text && activeContact && currentUser){
    push(ref(db, 'chats/' + chatId()), { sender: currentUser.email, text: text, time: Date.now() });
    document.getElementById('msgInput').value = "";
  }
}
</script>
</body>
</html>
