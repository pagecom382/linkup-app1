<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LinkUp - Email Verification</title>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<style>
  body { font-family: Arial; background: #0a0a0a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; }
  .box { background: #1a1a1a; padding: 30px; border-radius: 15px; width: 90%; max-width: 400px; }
  input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #333; background: #222; color: white; }
  button { width: 100%; padding: 12px; background: #8B5CF6; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
  button:disabled { background: #555; }
  .hidden { display: none; }
</style>
</head>
<body>

<div class="box">
  <h2>LinkUp 🔮</h2>
  
  <!-- STEP 1: ENTER EMAIL -->
  <div id="step1">
    <p>Enter your email to get verification code</p>
    <input type="email" id="email" placeholder="your@email.com" required>
    <button onclick="sendOTP()">Send Code</button>
  </div>

  <!-- STEP 2: ENTER CODE -->
  <div id="step2" class="hidden">
    <p>We sent code to <b id="showEmail"></b></p>
    <input type="text" id="otp" placeholder="Enter 6 digit code" maxlength="6">
    <button onclick="verifyOTP()">Verify</button>
    <p id="message"></p>
  </div>
</div>

<script>
// YOUR EMAILJS KEYS - ALREADY PLUGGED IN
emailjs.init("KjEOuOylcmZSiRElm");

const SERVICE_ID = "service_uc66is9";
const TEMPLATE_ID = "9nwkcll";

let generatedOTP = "";

function generateOTP() {
  return Math.floor(100000 + Math.random() * 900000).toString();
}

function sendOTP() {
  const email = document.getElementById("email").value;
  if(!email) return alert("Please enter email");
  
  generatedOTP = generateOTP();
  
  const templateParams = {
    to_email: email,
    code: generatedOTP
  };

  emailjs.send(SERVICE_ID, TEMPLATE_ID, templateParams)
    .then(() => {
      document.getElementById("step1").classList.add("hidden");
      document.getElementById("step2").classList.remove("hidden");
      document.getElementById("showEmail").innerText = email;
      alert("Code sent! Check your email");
    })
    .catch((err) => {
      alert("Error: " + JSON.stringify(err));
    });
}

function verifyOTP() {
  const userOTP = document.getElementById("otp").value;
  const msg = document.getElementById("message");
  
  if(userOTP === generatedOTP) {
    msg.style.color = "green";
    msg.innerText = "✅ Verified! You can continue to LinkUp";
  } else {
    msg.style.color = "red";
    msg.innerText = "❌ Wrong code. Try again";
  }
}
</script>

</body>
</html>
